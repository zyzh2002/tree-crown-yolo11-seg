# Default training configuration for tree-crown YOLO11-seg.
# Overridable via CLI flags on train.py (e.g. --epochs 100).

data: data.yaml

model: yolo11n-seg.pt   # official Ultralytics YOLO11-seg variant

task: segment

# Input resolution (fixed for the onboard contract: 1280x1280 NCHW).
imgsz: 1280

epochs: 100
# Conservative batch for an 8 GiB GPU at 1280x1280. Raise it only after a
# short run (or `batch: -1` AutoBatch) confirms headroom on the target GPU.
batch: 4

# Training device: auto-select GPU if available.
device: 0

# Reproducibility.
seed: 0
deterministic: true

# Export settings (used by export.py).
export:
  imgsz: 1280
  opset: 17
  simplify: true
  dynamic: false
  half: false