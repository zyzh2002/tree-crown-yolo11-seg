# OAM-TCD single-class tree-crown pretraining configuration.
# Produces a weight-initialization checkpoint for the final Xi'an two-class
# model. The output may be backed up with stage.py but is NEVER deployable and
# is NEVER published via publish.py.
#
# Data must first be converted:
#   python prepare_oamtcd.py --output data/oamtcd-rgb
#
# Overridable via CLI flags on train.py (e.g. --imgsz 1280 --batch 2).

data: data/oamtcd-rgb/data.yaml   # corrected RGB single-class tree-crown dataset

model: yolo11n-seg.pt         # official Ultralytics YOLO11-seg variant

task: segment

# Input resolution (fixed for the onboard contract: 1280x1280 NCHW).
imgsz: 1280

epochs: 50
# OAM-TCD has very high instance density (up to 870 instances/image, 18% of
# images >100). Segmentation mask memory scales with the number of instances in
# a batch. Start with the portable single-GPU baseline and override only after
# a one-epoch train+validation capacity check on the target platform.
batch: 2

# Portable default. The known V100 server may override with --device 4,5
# --batch 4 when both GPUs are idle and on the same NUMA node.
device: 0

# System RAM is 62 GiB (192 cores). workers 4 balances dataloader throughput
# against the prefetch_factor=4 memory each of the 8 total workers holds.
workers: 4

# Reproducibility.
seed: 0
deterministic: true

# OAM-TCD is a single generic class; single_cls keeps the loss single-class.
single_cls: true

# OAM-TCD contains up to hundreds of crowns per image. Keep validation above
# the observed dataset maximum so recall/AP are not truncated at the default
# max_det=300.
max_det: 1000

# Keep the run on disk / avoid caching the large dataset in RAM.
patience: 20
cache: false
plots: true
amp: true

# Output under runs/segment/ (ultralytics prepends runs/<task>/). Empty project
# keeps the path clean: runs/segment/oamtcd-stage1a-rgb.
project: ""
name: oamtcd-stage1a-rgb
