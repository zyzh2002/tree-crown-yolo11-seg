# Xi'an street-tree species instance-segmentation dataset definition.
# `classes` MUST stay identical to the `classes` list published in model.yaml
# (the onboard TensorRtEngine validates the ABI by name against model.yaml).
# The V1 class list is fixed by the design spec
# (.agents/docs/specs/2026-08-05-tree-crown-age-estimation-design.md).
#
# `other-tree` (class 4) is added only after the data-eligibility gate passes
# (exhaustive, species-reliable non-target annotations); see the spec.

path: data/                 # dataset root (git-ignored)
train: images/train
val: images/val
test: images/test

names:
  0: platanus
  1: styphnolobium-japonicum
  2: ginkgo-biloba
  3: koelreuteria-paniculata