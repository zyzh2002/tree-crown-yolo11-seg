[project]
name = "tree-crown-training"
version = "0.1.0"
description = "Training side of the tree-crown YOLO11-seg detection stack: train, export ONNX, publish to an HF private repo."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3.0",
    "onnx>=1.16.0",
    "huggingface-hub>=0.24.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]
data = [
    "datasets>=2.20.0",
    "pycocotools>=2.0.0",
    "polars>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["export", "prepare_oamtcd", "publish", "train"]

[tool.ruff]
line-length = 120
target-version = "py310"
# .agents/ holds agent-facing skills/doc markdown; not project source.
exclude = [".agents", ".superpowers", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# E501 is handled by the formatter; line-length is enforced separately.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
index-url = "https://mirrors.cernet.edu.cn/pypi/simple/"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
